<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />

    <!-- Primary Meta Tags -->
    <title>Senin Ashraf | AI & Data Science Engineer</title>
    <meta name="title" content="Senin Ashraf | AI & Data Science Engineer" />
    <meta name="description" content="Senin Ashraf is an AI & Data Science engineer from Kerala, India, building computer vision pipelines, bilingual AI assistants and full-stack products. Software Engineer Intern at Metadesign Software Solutions." />
    <meta name="author" content="Senin Ashraf" />
    <meta name="keywords" content="Senin Ashraf, AI engineer, Data Science, Computer Vision, Machine Learning, Agentic AI, React, FastAPI, Kerala, portfolio" />
    <link rel="canonical" href="https://senin.in/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Senin Ashraf" />
    <meta property="og:url" content="https://senin.in/" />
    <meta property="og:title" content="Senin Ashraf | AI & Data Science Engineer" />
    <meta property="og:description" content="Computer vision pipelines, bilingual AI assistants and full-stack products — the work of Senin Ashraf, AI & Data Science engineer." />
    <meta property="og:image" content="https://senin.in/senin-hero.jpg" />
    <meta property="og:image:alt" content="Pencil-sketch portrait of Senin Ashraf" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://senin.in/" />
    <meta name="twitter:title" content="Senin Ashraf | AI & Data Science Engineer" />
    <meta name="twitter:description" content="Computer vision pipelines, bilingual AI assistants and full-stack products — the work of Senin Ashraf, AI & Data Science engineer." />
    <meta name="twitter:image" content="https://senin.in/senin-hero.jpg" />

    <!-- Structured data: site name shown by Google, and the person behind it -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Senin Ashraf",
        "alternateName": ["Senin Ashraf | AI & Data Science Engineer", "senin.in"],
        "url": "https://senin.in/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Senin Ashraf",
        "url": "https://senin.in/",
        "image": "https://senin.in/senin-hero.jpg",
        "jobTitle": "AI & Data Science Engineer",
        "worksFor": { "@type": "Organization", "name": "Metadesign Software Solutions Pvt Ltd" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "MES College of Engineering, Kuttippuram" },
        "address": { "@type": "PostalAddress", "addressLocality": "Ponnani", "addressRegion": "Kerala", "addressCountry": "IN" },
        "email": "mailto:seninashraf765@gmail.com",
        "sameAs": [
          "https://github.com/SeninAshraf",
          "https://www.linkedin.com/in/senin-ashraf-96a29b252",
          "https://www.instagram.com/_senin___"
        ]
      }
    </script>

    <!-- Light by default; apply a saved night preference before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
